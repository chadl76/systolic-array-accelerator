# LibreLane config for the 4x4 systolic array
DESIGN_NAME: array_4x4            # the TOP module name
VERILOG_FILES:                    # every Verilog file the design needs
  - dir::src/array_4x4.v
  - dir::src/pe.v
CLOCK_PORT: clk                   # which input is the clock
CLOCK_PERIOD: 30                  # ns -> 100 MHz, from the spec
PDK: sky130A                      # SkyWater 130 nm
STD_CELL_LIBRARY: sky130_fd_sc_hd # the standard-cell library (the prebuilt cells)
FP_CORE_UTIL: 40                  # fill 40% of the core with cells (room to route)
IO_DELAY_CONSTRAINT: 5 
